server:
  port: "8080"
  mode: "debug"

logger:
  level: debug
  encoding: json
  filename: logs/app.log
  maxSize: 100
  maxAge: 7
  maxBackups: 10

swagger:
  title: "HarborArk API"
  description: "HarborArk 项目 API 文档"
  version: "1.0.0"
  host: "localhost:8080"
  basePath: "/api/v1"
  enabled: true
  autoUpdate: false
  outputDir: "cmd/docs"
  mainApiFile: "cmd/server.go"
  schemes:
    - "http"
    - "https"

metadata:
  badger:
    path: "data/badger"

audit:
  retentionDays: 30
  exportDir: "exports/audit"

fileManager:
  rootDir: "/Users/nic/Documents"
  allowedDirs:
    - "/Users/nic/Documents"
    - "/Users/nic/Downloads"
    - "/Users/nic/Desktop"
  restrictToAllowedDirs: true
  maxDepth: 10

monitor:
  enabled: true
  collectInterval: "15s"
  storagePath: "data/monitor"
  dataRetention:
    rawData: "7d"
    hourlyData: "30d"
    dailyData: "365d"
    monthlyData: "3y"
  alerts:
    enabled: true
    cpuThreshold: 80
    memoryThreshold: 85
    diskThreshold: 90
  protocols:
    iscsi:
      enabled: true
      configPath: "/etc/iscsi"
    samba:
      enabled: true
      configPath: "/etc/samba"
    nfs:
      enabled: true
      configPath: "/etc/exports"
