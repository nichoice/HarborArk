definitions:
  controller.CreateUserGroupRequest:
    properties:
      description:
        example: 系统管理员组
        type: string
      level:
        example: 1
        type: integer
      name:
        example: 管理员
        type: string
    required:
    - level
    - name
    type: object
  controller.CreateUserRequest:
    properties:
      group_id:
        example: 1
        type: integer
      password:
        example: "123456"
        type: string
      username:
        example: admin
        type: string
    required:
    - group_id
    - password
    - username
    type: object
  controller.LoginRequest:
    properties:
      password:
        example: "123456"
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  controller.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/model.User'
    type: object
  controller.PageResponse:
    properties:
      list: {}
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  controller.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  controller.UpdateUserGroupRequest:
    properties:
      description:
        example: 新的描述
        type: string
      level:
        example: 2
        type: integer
      name:
        example: 新管理员
        type: string
    type: object
  controller.UpdateUserRequest:
    properties:
      group_id:
        example: 2
        type: integer
      is_enabled:
        example: true
        type: boolean
      password:
        example: newpassword
        type: string
    type: object
  controller.deleteReq:
    properties:
      path:
        type: string
    required:
    - path
    type: object
  controller.exportAuditReq:
    properties:
      from:
        description: RFC3339
        type: string
      to:
        description: RFC3339
        type: string
    required:
    - from
    - to
    type: object
  controller.listResponse:
    properties:
      has_more:
        type: boolean
      limit:
        type: integer
      list:
        items:
          $ref: '#/definitions/service.FileItem'
        type: array
      next_offset:
        type: integer
      offset:
        type: integer
    type: object
  controller.mkdirReq:
    properties:
      name:
        description: 新目录名
        type: string
      path:
        description: 父目录
        type: string
    required:
    - name
    - path
    type: object
  controller.renameReq:
    properties:
      new_path:
        type: string
      old_path:
        type: string
    required:
    - new_path
    - old_path
    type: object
  controller.updateMetaReq:
    properties:
      meta:
        $ref: '#/definitions/service.FileMetadata'
      path:
        type: string
    required:
    - meta
    - path
    type: object
  model.User:
    properties:
      created_at:
        type: string
      group:
        $ref: '#/definitions/model.UserGroup'
      group_id:
        type: integer
      id:
        type: integer
      is_enabled:
        type: boolean
      last_login_at:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  model.UserGroup:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      level:
        type: integer
      name:
        type: string
      updated_at:
        type: string
      users:
        items:
          $ref: '#/definitions/model.User'
        type: array
    type: object
  monitor.CPUMetrics:
    properties:
      cores:
        description: CPU核心数
        type: integer
      load_avg_1:
        description: 1分钟负载
        type: number
      load_avg_5:
        description: 5分钟负载
        type: number
      load_avg_15:
        description: 15分钟负载
        type: number
      timestamp:
        type: string
      usage:
        description: CPU使用率 (%)
        type: number
    type: object
  monitor.DiskIO:
    properties:
      read_bytes:
        description: 读取字节数
        type: integer
      read_ops:
        description: 读取操作数
        type: integer
      write_bytes:
        description: 写入字节数
        type: integer
      write_ops:
        description: 写入操作数
        type: integer
    type: object
  monitor.DiskMetrics:
    properties:
      io:
        allOf:
        - $ref: '#/definitions/monitor.DiskIO'
        description: 磁盘I/O统计
      timestamp:
        type: string
      usage:
        description: 磁盘使用情况
        items:
          $ref: '#/definitions/monitor.DiskUsage'
        type: array
    type: object
  monitor.DiskUsage:
    properties:
      available:
        description: 可用 (bytes)
        type: integer
      device:
        description: 设备名
        type: string
      filesystem:
        description: 文件系统类型
        type: string
      mountpoint:
        description: 挂载点
        type: string
      total:
        description: 总大小 (bytes)
        type: integer
      usage:
        description: 使用率 (%)
        type: number
      used:
        description: 已使用 (bytes)
        type: integer
    type: object
  monitor.MemoryMetrics:
    properties:
      available:
        description: 可用内存 (bytes)
        type: integer
      swap_total:
        description: 交换分区总大小 (bytes)
        type: integer
      swap_used:
        description: 交换分区已使用 (bytes)
        type: integer
      timestamp:
        type: string
      total:
        description: 总内存 (bytes)
        type: integer
      usage:
        description: 内存使用率 (%)
        type: number
      used:
        description: 已使用内存 (bytes)
        type: integer
    type: object
  monitor.MetricRecord:
    properties:
      created_at:
        type: string
      id:
        type: integer
      labels:
        description: JSON格式存储标签
        type: string
      metric_name:
        type: string
      metric_type:
        type: string
      timestamp:
        type: string
      value:
        type: number
    type: object
  monitor.NetworkInterface:
    properties:
      bytes_recv:
        description: 接收字节数
        type: integer
      bytes_sent:
        description: 发送字节数
        type: integer
      drops:
        description: 丢包数
        type: integer
      errors:
        description: 错误数
        type: integer
      name:
        description: 接口名
        type: string
      packets_recv:
        description: 接收包数
        type: integer
      packets_sent:
        description: 发送包数
        type: integer
    type: object
  monitor.NetworkMetrics:
    properties:
      interfaces:
        items:
          $ref: '#/definitions/monitor.NetworkInterface'
        type: array
      timestamp:
        type: string
    type: object
  monitor.SystemMetrics:
    properties:
      cpu:
        $ref: '#/definitions/monitor.CPUMetrics'
      disk:
        $ref: '#/definitions/monitor.DiskMetrics'
      memory:
        $ref: '#/definitions/monitor.MemoryMetrics'
      network:
        $ref: '#/definitions/monitor.NetworkMetrics'
    type: object
  service.CPUOverview:
    properties:
      cores:
        type: integer
      load_avg_1:
        type: number
      load_avg_5:
        type: number
      usage:
        type: number
    type: object
  service.DiskOverview:
    properties:
      total:
        type: integer
      usage:
        type: number
      used:
        type: integer
    type: object
  service.FileItem:
    properties:
      is_dir:
        type: boolean
      meta:
        $ref: '#/definitions/service.FileMetadata'
      mod_time:
        description: ms
        type: integer
      mode:
        type: integer
      name:
        type: string
      path:
        type: string
      size:
        type: integer
    type: object
  service.FileMetadata:
    properties:
      created_at:
        description: ms
        type: integer
      created_by:
        type: integer
      created_by_name:
        type: string
      custom:
        additionalProperties:
          type: string
        type: object
      notes:
        type: string
      tags:
        items:
          type: string
        type: array
      updated_at:
        description: ms
        type: integer
      updated_by:
        type: integer
      updated_by_name:
        type: string
    type: object
  service.MemoryOverview:
    properties:
      available:
        type: integer
      total:
        type: integer
      usage:
        type: number
      used:
        type: integer
    type: object
  service.NetworkOverview:
    properties:
      bytes_recv:
        type: integer
      bytes_sent:
        type: integer
    type: object
  service.SystemOverview:
    properties:
      cpu:
        $ref: '#/definitions/service.CPUOverview'
      disk:
        $ref: '#/definitions/service.DiskOverview'
      memory:
        $ref: '#/definitions/service.MemoryOverview'
      network:
        $ref: '#/definitions/service.NetworkOverview'
      timestamp:
        type: string
    type: object
  storage.AggregatedMetric:
    properties:
      avg_value:
        type: number
      count:
        type: integer
      max_value:
        type: number
      metric_name:
        type: string
      min_value:
        type: number
      time_bucket:
        type: string
      timestamp:
        type: string
    type: object
info:
  contact: {}
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 用户登录获取JWT token
      parameters:
      - description: 登录信息
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/controller.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  $ref: '#/definitions/controller.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.Response'
      summary: 用户登录
      tags:
      - 认证
  /fs/delete:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.deleteReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.Response'
      security:
      - BearerAuth: []
      summary: 删除文件或目录
      tags:
      - 文件管理
  /fs/export-audit:
    post:
      consumes:
      - application/json
      parameters:
      - description: 时间范围
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.exportAuditReq'
      produces:
      - application/json
      responses:
        "200":
          description: zip 文件路径
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  type: string
              type: object
      security:
      - BearerAuth: []
      summary: 导出审计日志（Zip）
      tags:
      - 文件管理
  /fs/list:
    get:
      parameters:
      - default: 0
        description: 偏移
        in: query
        name: offset
        type: integer
      - default: 50
        description: 数量
        in: query
        name: limit
        type: integer
      - default: false
        description: 是否包含隐藏文件
        in: query
        name: hidden
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  $ref: '#/definitions/controller.listResponse'
              type: object
      security:
      - BearerAuth: []
      summary: 列出目录
      tags:
      - 文件管理
  /fs/metadata:
    get:
      parameters:
      - description: 路径
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.FileMetadata'
              type: object
      security:
      - BearerAuth: []
      summary: 获取元数据
      tags:
      - 文件管理
    put:
      consumes:
      - application/json
      parameters:
      - description: 参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.updateMetaReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.Response'
      security:
      - BearerAuth: []
      summary: 更新元数据
      tags:
      - 文件管理
  /fs/mkdir:
    post:
      consumes:
      - application/json
      parameters:
      - description: 参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.mkdirReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.Response'
      security:
      - BearerAuth: []
      summary: 创建目录
      tags:
      - 文件管理
  /fs/rename:
    post:
      consumes:
      - application/json
      parameters:
      - description: 参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.renameReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.Response'
      security:
      - BearerAuth: []
      summary: 重命名或移动
      tags:
      - 文件管理
  /monitor/aggregated:
    get:
      consumes:
      - application/json
      description: 获取指定时间范围内的聚合指标数据
      parameters:
      - description: 指标类型
        in: query
        name: type
        required: true
        type: string
      - default: 1h
        description: 聚合间隔
        in: query
        name: interval
        type: string
      - description: 开始时间
        format: date-time
        in: query
        name: start
        required: true
        type: string
      - description: 结束时间
        format: date-time
        in: query
        name: end
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/storage.AggregatedMetric'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.Response'
      summary: 获取聚合指标数据
      tags:
      - 监控
  /monitor/health:
    get:
      consumes:
      - application/json
      description: 获取监控服务的运行状态和配置信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
      summary: 获取监控服务健康状态
      tags:
      - 监控
  /monitor/latest:
    get:
      consumes:
      - application/json
      description: 获取指定类型的最新指标数据
      parameters:
      - description: 指标类型
        in: query
        name: type
        required: true
        type: string
      - default: 10
        description: 限制数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/monitor.MetricRecord'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.Response'
      summary: 获取最新指标数据
      tags:
      - 监控
  /monitor/metrics/{type}:
    get:
      consumes:
      - application/json
      description: 获取指定类型和时间范围的指标数据
      parameters:
      - description: 指标类型
        enum:
        - cpu
        - memory
        - disk
        - network
        in: path
        name: type
        required: true
        type: string
      - default: 1h
        description: 时间范围
        in: query
        name: range
        type: string
      - default: 100
        description: 限制数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/monitor.MetricRecord'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.Response'
      summary: 按类型获取指标数据
      tags:
      - 监控
  /monitor/range:
    get:
      consumes:
      - application/json
      description: 获取指定时间范围内的指标数据
      parameters:
      - description: 指标类型
        in: query
        name: type
        required: true
        type: string
      - description: 指标名称
        in: query
        name: name
        type: string
      - description: 开始时间
        format: date-time
        in: query
        name: start
        required: true
        type: string
      - description: 结束时间
        format: date-time
        in: query
        name: end
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/monitor.MetricRecord'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.Response'
      summary: 按时间范围获取指标
      tags:
      - 监控
  /monitor/system/metrics:
    get:
      consumes:
      - application/json
      description: 获取指定时间范围内的系统指标数据
      parameters:
      - default: 1h
        description: 时间范围
        in: query
        name: range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  $ref: '#/definitions/monitor.SystemMetrics'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.Response'
      summary: 获取系统指标数据
      tags:
      - 监控
  /monitor/system/overview:
    get:
      consumes:
      - application/json
      description: 获取CPU、内存、磁盘、网络的概览信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.SystemOverview'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.Response'
      summary: 获取系统监控概览
      tags:
      - 监控
  /user-groups:
    get:
      consumes:
      - application/json
      description: 分页获取用户组列表
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  $ref: '#/definitions/controller.PageResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.Response'
      security:
      - BearerAuth: []
      summary: 获取用户组列表
      tags:
      - 用户组管理
    post:
      consumes:
      - application/json
      description: 创建新用户组
      parameters:
      - description: 用户组信息
        in: body
        name: group
        required: true
        schema:
          $ref: '#/definitions/controller.CreateUserGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.UserGroup'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.Response'
      security:
      - BearerAuth: []
      summary: 创建用户组
      tags:
      - 用户组管理
  /user-groups/{id}:
    delete:
      consumes:
      - application/json
      description: 删除用户组
      parameters:
      - description: 用户组ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.Response'
      security:
      - BearerAuth: []
      summary: 删除用户组
      tags:
      - 用户组管理
    get:
      consumes:
      - application/json
      description: 根据ID获取用户组详情
      parameters:
      - description: 用户组ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.UserGroup'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.Response'
      security:
      - BearerAuth: []
      summary: 获取用户组详情
      tags:
      - 用户组管理
    put:
      consumes:
      - application/json
      description: 更新用户组信息
      parameters:
      - description: 用户组ID
        in: path
        name: id
        required: true
        type: integer
      - description: 用户组信息
        in: body
        name: group
        required: true
        schema:
